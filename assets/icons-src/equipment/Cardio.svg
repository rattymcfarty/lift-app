  <!-- flywheel -->
  <circle fill="#ff7a1a" cx="14.6" cy="31" r="8" />
  <circle fill="none" stroke="#b34700" stroke-width="0.9" cx="14.6" cy="31" r="4.6" />
  <circle fill="none" stroke="#b34700" stroke-width="0.9" cx="14.6" cy="31" r="8" />

  <!-- frame: down tube, seat post, handlebar -->
