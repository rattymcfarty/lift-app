# Build a program: name, duration, schedule mode, days, exercises, sets.
appId: app.lift.mobile
---
- launchApp:
    clearState: true
- runFlow: _skip-onboarding.yaml
- assertVisible:
    id: "home-start-workout"
# Programs is a menu destination since 2026-10-26.
- tapOn:
    id: "topbar-panel"
- tapOn:
    id: "panel-programs"
- tapOn:
    id: "programs-create"
# ---- page 1: name / tagline / description / thumbnail
- assertVisible: "Program Details"
- assertVisible: "Program Name"
- tapOn:
    id: "details-name"
- eraseText: 40
- inputText: "My Test Program"
- tapOn:
    id: "details-tagline"
- inputText: "Train. Evolve. Endure."
- hideKeyboard
- assertVisible: "15/50"
- tapOn:
    id: "details-next"
# ---- page 2: time / focus / equipment / difficulty
- assertVisible: "Time per Workout"
- assertVisible: "Equipment"
- tapOn:
    id: "focus-Muscle"
- tapOn:
    id: "equipment-Dumbbell-Only"
# The wizard now uses the shared (taller) ScreenHeader, so the last rows of the
# form can sit below the fold: scroll to them instead of failing the tap.
- scrollUntilVisible:
    element:
      id: "difficulty-Advanced"
    direction: DOWN
- tapOn:
    id: "difficulty-Advanced"
# "Time per workout" sits above Focus, so after scrolling down to Difficulty it is
# back up the page.
- scrollUntilVisible:
    element:
      id: "setup-minutes"
    direction: UP
- tapOn:
    id: "setup-minutes"
- tapOn:
    id: "minutes-sheet-45"
- assertVisible: "45 mins"
- scrollUntilVisible:
    element:
      id: "setup-next"
    direction: DOWN
- tapOn:
    id: "setup-next"
# ---- builder
# The program name is the page title now (shared ScreenHeader), so assert the
# text rather than the old in-content testID.
- assertVisible: "My Test Program"
- assertVisible: "Train. Evolve. Endure."
- assertVisible: ".*Dumbbell Only.*"
# duration + schedule
- tapOn:
    id: "program-weeks"
- tapOn:
    id: "weeks-sheet-12"
- assertVisible: "12 Weeks"
- tapOn:
    id: "program-schedule"
- tapOn:
    id: "schedule-sheet-custom"
- assertVisible:
    id: "program-week-1"
- assertVisible: "Different Weeks"
# days
- assertVisible: "Day 3 .*"
- scrollUntilVisible:
    element:
      id: "program-add-day"
- tapOn:
    id: "program-add-day"
- assertVisible: "Day 4 .*"
# deload week + copy week
- scrollUntilVisible:
    element:
      id: "program-deload"
    direction: UP
- tapOn:
    id: "program-deload"
- tapOn:
    id: "deload-sheet-4"
- assertVisible: "Deload wk 4"
- assertVisible: "Week 4 ↓"
- tapOn:
    id: "program-copy-week"
- tapOn:
    id: "copy-week-sheet-1"
- assertVisible: "Replace week\\?"
- tapOn: "Copy"
- scrollUntilVisible:
    element:
      id: "program-week-2"
    direction: UP
- tapOn:
    id: "program-week-2"
- scrollUntilVisible:
    element: "Day 4 .*"
- scrollUntilVisible:
    element:
      id: "program-week-1"
    direction: UP
- tapOn:
    id: "program-week-1"
- scrollUntilVisible:
    element:
      id: "day-add-exercise-1"
# add an exercise to day 1 and set the sets target
- tapOn:
    id: "day-add-exercise-1"
# Dumbbell Only was chosen on page 2 -> the picker starts filtered to it
- assertVisible: "Equipment \\(3\\)"
- tapOn:
    id: "plan-picker-search"
- inputText: "Goblet Squat"
- hideKeyboard
- tapOn:
    id: "plan-add-exercise-row-goblet-squat"
- assertVisible: "Goblet Squat.*"
- tapOn:
    id: "day-1-sets-1"
- inputText: "5"
- hideKeyboard
- assertVisible:
    id: "day-1-sets-1"
    text: "5"
# back to the library: the program is listed
- tapOn:
    id: "program-finish"
- assertVisible: "MY PROGRAMS.*"
- assertVisible: "My Test Program"
