# Builds a workout with a 4-set exercise and leaves the app on that screen, so
# layouts can be inspected at different window widths / text sizes (adb wm).
appId: app.lift.mobile
---
- launchApp:
    clearState: true
- runFlow: _skip-onboarding.yaml
- assertVisible:
    id: "home-start-workout"
- tapOn:
    id: "home-start-workout"
- tapOn:
    id: "new-workout-start-blank"
- tapOn:
    id: "workout-add-exercise"
- tapOn:
    id: "add-exercise-search"
- inputText: "Goblet Squat"
- hideKeyboard
- tapOn:
    id: "add-exercise-row-goblet-squat"
- tapOn:
    id: "picker-add-exercises"
- tapOn:
    id: "add-set"
- tapOn:
    id: "set-weight-1"
# The wheel is the default now — one tap deeper for the keypad.
- tapOn:
    id: "wheel-sheet-type"
- extendedWaitUntil:
    visible:
      id: "set-weight-1-input"
    timeout: 5000
- inputText: "135.5"
- tapOn:
    id: "set-reps-1"
# The wheel is the default now — one tap deeper for the keypad.
- tapOn:
    id: "wheel-sheet-type"
- extendedWaitUntil:
    visible:
      id: "set-reps-1-input"
    timeout: 5000
- inputText: "12"
- hideKeyboard
- tapOn:
    id: "log-set-1"
- tapOn:
    id: "add-set"
- tapOn:
    id: "add-set"
