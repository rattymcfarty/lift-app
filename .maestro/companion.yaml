# Companion: the creature sits fixed in the TopBar centre (circular glass ring)
# and still does not block the screen underneath.
# Run: maestro test .maestro/companion.yaml
appId: app.lift.mobile
---
- launchApp:
    clearState: true
- runFlow: _skip-onboarding.yaml
- assertVisible:
    id: "companion"
- assertVisible:
    id: "home-start-workout"
# Tapping a tab underneath the overlay must still work.
# Programs is a menu destination since 2026-10-26.
- tapOn:
    id: "topbar-panel"
- tapOn:
    id: "panel-programs"
- assertVisible: "Explore"
- tapOn:
    id: "tab-train"
- assertVisible:
    id: "home-start-workout"
# Tapping the creature itself reacts but does not navigate.
- tapOn:
    id: "companion"
- assertVisible:
    id: "home-start-workout"
- assertVisible:
    id: "companion"
