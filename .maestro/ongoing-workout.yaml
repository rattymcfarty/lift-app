# The ongoing workout outranks everything (owner decisions 2026-10-25/26):
#   - its title is the live (accent) one, and it has no back arrow,
#   - a floating badge with the elapsed time is on every other screen,
#   - one tap from anywhere returns to it,
#   - Train ALWAYS means the running session: tapping that door never parks it
#     behind a "Resume workout" card and never pauses it,
#   - finishing/discarding ends the state everywhere.
# Run: maestro test .maestro/ongoing-workout.yaml   (fresh state)
appId: app.lift.mobile
---
- launchApp:
    clearState: true
- runFlow: _skip-onboarding.yaml
- tapOn:
    id: "home-start-workout"
- tapOn:
    id: "new-workout-start-blank"
- assertVisible:
    id: "workout-add-exercise"
# On the workout itself: it is the main window (no back arrow), the title says it,
# and the floating bar stays visible — the bar never disappears (2026-10-26).
- assertVisible:
    id: "screen-title"
- assertNotVisible:
    id: "header-back"
- assertVisible:
    id: "tab-train"
- assertVisible:
    id: "tab-analytics"
- assertVisible:
    id: "tab-exercises"
- assertNotVisible:
    id: "topbar-workout"

# Another door: the session keeps running and the badge shows a live clock.
- tapOn:
    id: "tab-analytics"
- assertVisible:
    id: "topbar-workout"
- assertVisible:
    id: "topbar-workout-elapsed"
    text: ".*:.*"

# Train = the running session. No "Workout in progress" card, no Resume step:
# the same open screen is back, and the badge goes away with it.
- tapOn:
    id: "tab-train"
- assertVisible:
    id: "workout-add-exercise"
- assertNotVisible:
    id: "home-resume-workout"
- assertNotVisible:
    id: "topbar-workout"

# The badge is still the one-tap way back from anywhere else.
- tapOn:
    id: "tab-exercises"
- assertVisible:
    id: "topbar-workout"
- tapOn:
    id: "topbar-workout"
- assertVisible:
    id: "workout-add-exercise"

# It survives the left panel's destinations too…
- tapOn:
    id: "tab-analytics"
- tapOn:
    id: "topbar-panel"
- scrollUntilVisible:
    element:
      id: "panel-more-history"
    direction: DOWN
- tapOn:
    id: "panel-more-history"
- assertVisible:
    id: "topbar-workout"

# …and a relaunch lands IN the session, not on a Resume card (the workout is the
# home page while it is open).
- launchApp
- assertVisible:
    id: "workout-add-exercise"
- assertNotVisible:
    id: "home-resume-workout"

# Finish: the priority state clears everywhere.
- tapOn:
    id: "workout-finish"
- tapOn:
    id: "finish-sheet-finish"
- back
- assertNotVisible:
    id: "topbar-workout"
