# Side panels smoke test.
#
# The two top-bar buttons open the left menu (features) and the right settings
# panel; tapping a section jumps to it; the close button and a tap on the scrim
# dismiss the panel; a "More" item navigates and dismisses it.
#
# Since 2026-10-26 the bar has three main doors (Train · Analytics · Exercises);
# Programs is a menu destination that opens as a page with a back arrow.
#
# Note the order: the "More" step leaves the tab routes, so it comes last.
#
# Run: maestro test .maestro/panels.yaml
appId: app.lift.mobile
---
- launchApp:
    clearState: true
- runFlow: _skip-onboarding.yaml
- assertVisible:
    id: "home-start-workout"

# --- left panel opens and lists the three doors, the features and the scrim ---
- tapOn:
    id: "topbar-panel"
- assertVisible:
    id: "panel-tab-train"
- assertVisible:
    id: "panel-tab-analytics"
- assertVisible:
    id: "panel-tab-exercises"
- assertNotVisible:
    id: "panel-tab-programs"
- assertVisible:
    id: "panel-programs"
- assertVisible:
    id: "panel-new-workout"
- assertVisible:
    id: "panel-search"
- assertVisible:
    id: "panel-scrim"

# --- a section row jumps to that tab, and the panel closes behind it ---
- tapOn:
    id: "panel-tab-analytics"
- assertVisible: "Analytics"
- assertNotVisible:
    id: "panel-tab-analytics"

# --- Programs is a page now: opened from the menu, closed with its own back ---
- tapOn:
    id: "topbar-panel"
- tapOn:
    id: "panel-programs"
- assertVisible:
    id: "programs-segment-explore"
- tapOn:
    id: "header-back"
# Back returns to the screen the menu was opened from (Analytics at this point).
- assertVisible: "Analytics"

# --- the close button dismisses the panel ---
- tapOn:
    id: "topbar-panel"
- tapOn:
    id: "panel-close"
- assertNotVisible:
    id: "panel-tab-analytics"

# --- the right panel shows settings; a tap on the bare strip dismisses it ---
- tapOn:
    id: "topbar-settings"
- assertVisible:
    id: "settings-profile"
- assertNotVisible:
    id: "panel-tab-analytics"
- tapOn:
    point: "5%,50%"
- assertNotVisible:
    id: "settings-profile"

# --- the left panel also closes on a tap outside it ---
- tapOn:
    id: "topbar-panel"
- assertVisible:
    id: "panel-tab-analytics"
- tapOn:
    point: "95%,50%"
- assertNotVisible:
    id: "panel-tab-analytics"

# --- a More item navigates, and the panel is gone (last: it leaves the tabs) ---
- tapOn:
    id: "topbar-panel"
- scrollUntilVisible:
    element:
      id: "panel-more-history"
    direction: DOWN
- tapOn:
    id: "panel-more-history"
- assertNotVisible:
    id: "panel-new-workout"
- assertVisible: "History"
