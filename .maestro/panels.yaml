# Side panels smoke test.
#
# The two top-bar buttons open the left menu (features) and the right settings
# panel; the close button and a tap on the scrim dismiss either; a "More" item
# navigates and dismisses the menu.
#
# Since 2026-10-26 the bar has three main doors (Train · Analytics · Exercises)
# and the menu neither lists nor reorders them; Programs is a menu destination
# that opens as a page with a back arrow.
#
# Run: maestro test .maestro/panels.yaml
appId: app.lift.mobile
---
- launchApp:
    clearState: true
- runFlow: _skip-onboarding.yaml
- assertVisible:
    id: "home-start-workout"

# --- the three doors are on the bar, where they belong ---
- assertVisible:
    id: "tab-train"
- assertVisible:
    id: "tab-analytics"
- assertVisible:
    id: "tab-exercises"
- assertNotVisible:
    id: "tab-programs"

# --- the left menu lists features, not sections ---
- tapOn:
    id: "topbar-panel"
- assertVisible:
    id: "panel-programs"
- assertVisible:
    id: "panel-new-workout"
- assertVisible:
    id: "panel-search"
- assertVisible:
    id: "panel-scrim"
- assertVisible:
    id: "panel-close"
# The old "Tabs" reorder block is gone with the four-door bar.
- assertNotVisible: "Long-press and drag to reorder the bar"

# --- the close button dismisses it ---
- tapOn:
    id: "panel-close"
- assertNotVisible:
    id: "panel-programs"

# --- Programs opens from the menu as a page, and back returns ---
- tapOn:
    id: "topbar-panel"
- tapOn:
    id: "panel-programs"
- assertVisible:
    id: "programs-segment-explore"
- tapOn:
    id: "header-back"
- assertVisible:
    id: "home-start-workout"

# --- a tap outside the left panel closes it ---
- tapOn:
    id: "topbar-panel"
- assertVisible:
    id: "panel-programs"
- tapOn:
    point: "95%,50%"
- assertNotVisible:
    id: "panel-programs"

# --- the right panel shows settings; a tap on the bare strip closes it ---
- tapOn:
    id: "topbar-settings"
- assertVisible:
    id: "settings-reminders-off"
- tapOn:
    point: "5%,50%"
- assertNotVisible:
    id: "settings-reminders-off"

# --- a More item navigates, and the menu is gone (last: it leaves the tabs) ---
- tapOn:
    id: "topbar-panel"
- scrollUntilVisible:
    element:
      id: "panel-more-history"
    direction: DOWN
- tapOn:
    id: "panel-more-history"
- assertNotVisible:
    id: "panel-new-workout"
- assertVisible: "History"
