# Exercise actions menu + reorder + warmups + rest timer (REFERENCE A/B/C).
# Run: maestro test .maestro/exercise-menu.yaml  (needs the debug APK + emulator)
# By testID; requires fresh app state (clearState).
appId: app.lift.mobile
---
- launchApp:
    clearState: true
- runFlow: _skip-onboarding.yaml

# Home → start a blank workout
- tapOn:
    id: "home-start-workout"
- tapOn:
    id: "new-workout-start-blank"

# Add two exercises so reorder has something to move.
- tapOn:
    id: "workout-add-exercise"
- tapOn:
    id: "add-exercise-search"
- inputText: "Goblet Squat"
- tapOn:
    id: "add-exercise-row-goblet-squat"
- tapOn:
    id: "picker-add-exercises"

- tapOn:
    id: "workout-add-exercise"
- tapOn:
    id: "add-exercise-search"
- inputText: "Romanian Deadlift"
- tapOn:
    id: "add-exercise-row-romanian-deadlift(-[0-9]+)?"
- tapOn:
    id: "picker-add-exercises"

# --- Actions sheet (REFERENCE A) -------------------------------------------
- tapOn:
    id: "exercise-actions"
    index: 0
- assertVisible: "Actions"

# Rest Timer: open the preset list and pick 2:00.
- tapOn:
    id: "action-rest-timer"
- tapOn:
    id: "rest-preset-120"
- tapOn:
    id: "action-sheet-close"

# --- Log a working set on the first exercise (20 kg x 5) -------------------
- tapOn:
    id: "add-set"
- tapOn:
    id: "set-reps-1"
- inputText: "5"
- tapOn:
    id: "set-weight-1"
- inputText: "20"
- tapOn:
    id: "log-set-1"

# --- Add Warmup Sets via the sheet -----------------------------------------
- tapOn:
    id: "exercise-actions"
    index: 0
- tapOn:
    id: "action-add-warmup"
# The actions sheet closes and the warm-up sheet opens.
- assertVisible:
    id: "warmup-sheet"
# The working weight is prefilled from the logged 20 kg set, so the preview
# shows 50/70/85% of 20 kg (10, 14, 17). No retyping: tapping the middle of a
# prefilled field puts the caret between the digits and typing corrupts it.
- assertVisible:
    id: "warmup-weight-input"
- tapOn:
    id: "warmup-add"
# The sheet closes; the ramp rows appear above the working set: the W badge
# on the first warm-up row (set 2) and 50% of 20 kg prefilled.
- assertVisible:
    id: "set-warmup-badge-2"
- assertVisible:
    text: "10"

# --- Reorder Exercises (REFERENCE B) --------------------------------------
- tapOn:
    id: "exercise-actions"
    index: 0
- tapOn:
    id: "action-reorder"
- assertVisible:
    id: "reorder-sheet"
# Move the first exercise down one, then save.
- tapOn:
    id: "reorder-down-0"
- tapOn:
    id: "reorder-ok"
- assertVisible: "Romanian Deadlift.*"

# --- Create Superset: link the two exercises, see the group tag, unlink ----
- tapOn:
    id: "exercise-actions"
    index: 0
- scrollUntilVisible:
    element:
      id: "action-create-superset"
- tapOn:
    id: "action-create-superset"
- assertVisible:
    id: "superset-sheet"
- tapOn:
    id: "superset-member-.*"
    index: 0
- tapOn:
    id: "superset-link"
- assertVisible: "SUPERSET A.*"
# Unlink again: the tag disappears.
- tapOn:
    id: "exercise-actions"
    index: 0
- scrollUntilVisible:
    element:
      id: "action-remove-superset"
- tapOn:
    id: "action-remove-superset"
- assertNotVisible: "SUPERSET A.*"
