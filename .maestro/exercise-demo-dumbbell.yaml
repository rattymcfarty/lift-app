# Dumbbell Bench Press: the second bundled movement clip. This guide opens the
# dumbbell loop, expands it full screen, and returns to the guide.
# Run: maestro test .maestro/exercise-demo-dumbbell.yaml   (fresh state)
appId: app.lift.mobile
---
- launchApp:
    clearState: true
- runFlow: _skip-onboarding.yaml
- tapOn:
    id: "tab-exercises"
- assertVisible: "Browse Exercises"
- tapOn:
    id: "browse-exercises-search"
- inputText: "Dumbbell Bench Press"
- hideKeyboard
- tapOn:
    id: "browse-exercise-row-dumbbell-bench-press"
- assertVisible:
    id: "exercise-demo"
- assertVisible: ".*Movement demo.*"
- tapOn:
    id: "exercise-demo-expand"
- assertVisible:
    id: "exercise-demo-fullscreen"
- assertVisible:
    id: "exercise-demo-close"
- tapOn:
    id: "exercise-demo-close"
- assertNotVisible:
    id: "exercise-demo-fullscreen"
- assertVisible:
    id: "exercise-demo"
