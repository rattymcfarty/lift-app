# Dumbbell Bench Press: two demo versions. The guide opens demo 1, switches to
# demo 2, expands it full screen, switches back to demo 1 inside the viewer, and
# returns to the guide.
# Run: maestro test .maestro/exercise-demo-dumbbell.yaml   (fresh state)
appId: app.lift.mobile
---
- launchApp:
    clearState: true
- runFlow: _skip-onboarding.yaml
- tapOn:
    id: "tab-exercises"
- assertVisible: "Browse Exercises"
- tapOn:
    id: "browse-exercises-search"
- inputText: "Dumbbell Bench Press"
- hideKeyboard
- tapOn:
    id: "browse-exercise-row-dumbbell-bench-press"
- assertVisible:
    id: "exercise-demo"
- assertVisible: ".*Movement demo 1 of 2.*"
- tapOn:
    id: "exercise-demo-version-2"
- assertVisible: ".*Movement demo 2 of 2.*"
- tapOn:
    id: "exercise-demo-expand"
- assertVisible:
    id: "exercise-demo-fullscreen"
- assertVisible:
    id: "exercise-demo-close"
- assertVisible: ".*Movement demo 2 of 2.*"
- tapOn:
    id: "exercise-demo-fullscreen-version-1"
- assertVisible: ".*Movement demo 1 of 2.*"
- tapOn:
    id: "exercise-demo-close"
- assertNotVisible:
    id: "exercise-demo-fullscreen"
- assertVisible:
    id: "exercise-demo"
