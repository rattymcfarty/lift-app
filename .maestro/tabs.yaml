# Bottom-tab navigation smoke test: every tab renders its screen.
# The bar is the floating, icon-only glass pill (layout redesign A3): items are
# selected by id — the test ids did not change with the redesign — and the
# on-screen assertions look at each screen's content, not at a tab label.
# Run: maestro test .maestro/tabs.yaml
appId: app.lift.mobile
---
- launchApp:
    clearState: true
- runFlow: _skip-onboarding.yaml
- assertVisible:
    id: "home-start-workout"
# Three main doors, in the default order (owner decision 2026-10-26).
- assertNotVisible:
    id: "tab-programs"
- assertVisible:
    id: "tab-train"
- assertVisible:
    id: "tab-analytics"
- assertVisible:
    id: "tab-exercises"
- tapOn:
    id: "tab-analytics"
- assertVisible: "Lifetime"
- tapOn:
    id: "tab-exercises"
- assertVisible: "Browse Exercises"
- tapOn:
    id: "tab-train"
# The section title names the tab, and the first segment names the sub-view
# ("Today", renamed from "Train" when Programs got the same header shape).
- assertVisible: "Train"
- assertVisible: "Today"
- tapOn:
    id: "train-segment-history"
- assertVisible: "No workouts yet."
- tapOn:
    id: "train-segment-train"
- assertVisible:
    id: "home-start-workout"
