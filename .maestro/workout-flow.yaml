# LIFT happy-path E2E: log a workout and verify it in history.
# Run: maestro test .maestro/workout-flow.yaml
# Requires: debug APK installed (npm run build:android-debug on ai-rig1),
#   emulator booted, fresh app state (clear data between runs).
appId: app.lift.mobile
---
- launchApp:
    clearState: true
- runFlow: _skip-onboarding.yaml

# Home → start a blank workout
- tapOn:
    id: "home-start-workout"
- tapOn:
    id: "new-workout-start-blank"

# Active workout → add an exercise (multi-select picker, Slice B)
- tapOn:
    id: "workout-add-exercise"
- tapOn:
    id: "add-exercise-search"
- inputText: "Goblet Squat"
- tapOn:
    id: "add-exercise-row-goblet-squat"
- tapOn:
    id: "picker-add-exercises"

# Create the pending set row, then log set 1: 10 reps @ 20 kg
- tapOn:
    id: "add-set"
- tapOn:
    id: "set-reps-1"
- inputText: "10"
- tapOn:
    id: "set-weight-1"
- inputText: "20"
- tapOn:
    id: "log-set-1"

# Regression gate (P6 2026-10-12): the set must actually persist — the
# numeric keyboard used to swallow the first Log tap (missing
# keyboardShouldPersistTaps on the workout FlatList).
# Set 1 logged: REPS column shows 10, KG column shows 20
- assertVisible:
    text: "10"
- assertVisible:
    text: "20"

# A. Gradual sets + warmup exclusion
- tapOn:
    id: "add-set"
- tapOn:
    id: "set-reps-2"
- inputText: "12"
- tapOn:
    id: "set-weight-2"
- inputText: "25"
- tapOn:
    id: "log-set-2"
# Set 2 logged: REPS column shows 12, KG column shows 25
- assertVisible:
    text: "12"
- assertVisible:
    text: "25"

# Warmup set
- tapOn:
    id: "exercise-actions"
- tapOn:
    id: "action-add-warmup"
# Fill and log warmup (pending row appears after add-warmup trigger)
- tapOn:
    id: "set-reps-3"
- inputText: "5"
- tapOn:
    id: "set-weight-3"
- inputText: "10"
- tapOn:
    id: "log-set-3"
# Warmup set logged: 5 reps @ 10 kg (5 is unique to set 3; the WARMUP badge
# renders but is clipped at the row edge — layout issue noted for UI fix)
- assertVisible:
    text: "5"

# B. Swap exercise
- tapOn:
    id: "swap-exercise"
- tapOn:
    id: "swap-search"
- inputText: "Romanian Deadlift"
- tapOn:
    id: "swap-row-romanian-deadlift(-[0-9]+)?"
- tapOn:
    id: "swap-confirm"
- assertVisible: "Romanian Deadlift.*"
# Set 1 logged: REPS column shows 10, KG column shows 20
- assertVisible:
    text: "10"
- assertVisible:
    text: "20"

# C. Picker filters
- tapOn:
    id: "workout-add-exercise"
- tapOn:
    id: "picker-filter-muscle"
- tapOn:
    id: "picker-muscle-Chest"
# Collapse the muscle grid to reveal the filtered exercise list
- tapOn:
    id: "picker-filter-muscle"
# Chest has 50+ entries, alphabetical: scroll until Push-Up renders.
- scrollUntilVisible:
    element:
      id: "add-exercise-row-push-up"
    timeout: 180000
# D. Detail tabs (from picker exercise info)
- tapOn:
    id: "exercise-info-push-up"
- assertVisible:
    text: "Guide"
- tapOn:
    id: "exercise-tab-History"
- tapOn:
    id: "exercise-tab-Records"
- tapOn:
    id: "exercise-tab-Charts"
# System back: detail -> picker -> workout
- pressKey: back
- pressKey: back

# Finish → the finish/discard sheet → Finish workout → summary shows the
# logged exercise
- tapOn:
    id: "workout-finish"
- tapOn:
    id: "finish-sheet-finish"
- assertVisible: "Romanian Deadlift.*"
