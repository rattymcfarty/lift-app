# Building a plan: the Add-exercise picker must offer muscle + equipment
# filters, and applying one must narrow the list.
appId: app.lift.mobile
---
- launchApp:
    clearState: true
- runFlow: _skip-onboarding.yaml
- assertVisible:
    id: "home-start-workout"
# Programs is a menu destination since 2026-10-26.
- tapOn:
    id: "topbar-panel"
- tapOn:
    id: "panel-programs"
# One Create door: choose a single plan.
- tapOn:
    id: "programs-create"
- tapOn:
    id: "create-plan"
- tapOn:
    id: "plan-new-name"
- inputText: "Filter test plan"
- hideKeyboard
- tapOn:
    id: "plan-new-create"
- tapOn:
    id: "plan-edit-add-exercise"
# The filter chips are present…
- assertVisible:
    id: "plan-picker-filter-muscle"
- assertVisible:
    id: "plan-picker-filter-equipment"
# …and a filter narrows the list (Ab Wheel is Abs-only; Chest hides it).
- assertVisible: "Ab Wheel.*"
- tapOn:
    id: "plan-picker-filter-muscle"
- tapOn:
    id: "plan-picker-muscle-Chest"
- assertNotVisible: "Ab Wheel.*"
- assertVisible:
    id: "plan-picker-filter-muscle-clear"
- tapOn:
    id: "plan-picker-filter-muscle-clear"
# Collapse the muscle grid so the results area is back (it stays open after a
# filter is cleared, which would otherwise hide the row we tap next).
- tapOn:
    id: "plan-picker-filter-muscle"

# Add an exercise, expand its target editor, and open the RPE explainer from the
# RPE label — the same sheet the workout set table's RPE header opens.
- tapOn:
    id: "plan-picker-search"
- inputText: "Goblet Squat"
- hideKeyboard
- tapOn:
    id: "plan-add-exercise-row-goblet-squat"
- assertVisible: ".*Goblet Squat.*"
- tapOn:
    id: "plan-item-0"
- tapOn:
    id: "plan-rpe-help"
- assertVisible:
    id: "rpe-sheet"
- assertVisible:
    text: "Rate of Perceived Exertion"
- tapOn:
    id: "rpe-sheet-close"
- assertNotVisible:
    id: "rpe-sheet"
