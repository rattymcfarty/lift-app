# Shared sub-flow: dismiss the first-launch onboarding if it is showing.
# Waits for the Skip button (a slow or software-rendered emulator draws it late),
# taps it when it appears, then waits for the home screen.
appId: app.lift.mobile
---
- extendedWaitUntil:
    visible:
      id: "onb-skip"
    timeout: 120000
    optional: true
- runFlow:
    when:
      visible:
        id: "onb-skip"
    commands:
      - tapOn:
          id: "onb-skip"
- extendedWaitUntil:
    visible:
      id: "home-start-workout"
    timeout: 90000
