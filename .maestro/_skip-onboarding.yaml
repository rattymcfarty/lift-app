# Shared sub-flow: dismiss the first-launch onboarding if it is showing.
appId: app.lift.mobile
---
- runFlow:
    when:
      visible:
        id: "onb-skip"
    commands:
      - tapOn:
          id: "onb-skip"
# Software-rendered emulators start slowly: wait for the home screen.
- extendedWaitUntil:
    visible:
      id: "home-start-workout"
    timeout: 90000
