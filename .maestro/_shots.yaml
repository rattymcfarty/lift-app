# Debug helper: screenshots of key screens (glass chrome review).
appId: app.lift.mobile
---
- launchApp:
    clearState: true
- runFlow: _skip-onboarding.yaml
- takeScreenshot: shot-home
# Programs is a menu destination since 2026-10-26.
- tapOn:
    id: "topbar-panel"
- tapOn:
    id: "panel-programs"
- takeScreenshot: shot-programs
- tapOn:
    id: "tab-exercises"
- takeScreenshot: shot-exercises
- tapOn:
    id: "tab-train"
- tapOn:
    id: "home-start-workout"
- tapOn:
    id: "new-workout-start-blank"
- takeScreenshot: shot-workout

# Browse: controls pinned after the list is scrolled, then the muscle grid open.
- tapOn:
    id: "tab-exercises"
- scroll
- scroll
- takeScreenshot: shot-browse-scrolled
- tapOn:
    id: "browse-filter-muscle"
- takeScreenshot: shot-browse-filters
- tapOn:
    id: "browse-filter-muscle"

# Exercise guide: the Progression card (label/value layout, long guidance wraps).
- tapOn:
    id: "browse-exercise-row-.*"
    index: 0
- scrollUntilVisible:
    element:
      text: "Progression"
- takeScreenshot: shot-exercise-progression
